[package]
name = "polars-delta"
# Released independently of Polars; plugin IDs determine compatibility.
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = "https://github.com/nameexhaustion/polars-delta"
description = "Native Delta Lake I/O plugin for Polars."

# Built as a member of the Polars workspace from `crates/polars-delta`.
[lib]
name = "polars_delta"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
polars-arrow = { workspace = true }
polars-buffer = { workspace = true }
polars-error = { workspace = true }
polars-io-ext-ffi = { workspace = true, features = ["delta"] }
polars-parquet = { workspace = true, features = ["compression"] }
polars-utils = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
percent-encoding = { workspace = true }
url = "2"

pyo3 = { workspace = true, optional = true, features = ["abi3-py310", "extension-module"] }

[features]
default = []
python = ["dep:pyo3"]

[lints]
workspace = true
