[package]
name = "polars-delta"
# Released independently of Polars; plugin IDs determine compatibility.
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
publish = false
repository = "https://github.com/nameexhaustion/polars-delta"
description = "Native Delta Lake I/O plugin for Polars."

# Built as a member of the Polars workspace from `crates/polars-delta`.
[lib]
name = "polars_delta"
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1"
chrono = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
polars-arrow = { workspace = true, optional = true }
polars-buffer = { workspace = true, optional = true }
polars-error = { workspace = true, optional = true }
polars-io-ext-ffi = { workspace = true, optional = true, features = ["delta"] }
polars-parquet = { workspace = true, optional = true, features = ["compression"] }
polars-utils = { workspace = true, optional = true }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
percent-encoding = { workspace = true, optional = true }
url = { version = "2", optional = true }

pyo3 = { workspace = true, optional = true, features = ["abi3-py310", "extension-module"] }

[features]
default = []
planner = [
  "dep:chrono",
  "dep:futures",
  "dep:polars-arrow",
  "dep:polars-buffer",
  "dep:polars-error",
  "dep:polars-io-ext-ffi",
  "dep:polars-parquet",
  "dep:polars-utils",
  "dep:serde",
  "dep:serde_json",
  "dep:tokio",
  "dep:percent-encoding",
  "dep:url",
]
python = ["planner", "dep:pyo3"]

[lints]
workspace = true
