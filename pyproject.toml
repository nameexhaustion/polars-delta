[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polars-delta"
description = "Native Delta Lake I/O plugin for Polars"
readme = "README.pypi.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["version"]

[project.urls]
Homepage = "https://www.pola.rs/"
Polars = "https://pypi.org/project/polars/"
Repository = "https://github.com/nameexhaustion/polars-delta"

[tool.maturin]
features = ["python"]
module-name = "polars_delta"
# Keep the license at the sdist root for Python package metadata.
include = [{ path = "LICENSE", format = "sdist" }]
